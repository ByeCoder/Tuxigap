services:
  tuxigap:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE: /app/data/tuxigap.sqlite3
    volumes:
      - tuxigap-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  tuxigap-data:
