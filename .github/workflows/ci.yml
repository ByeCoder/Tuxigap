name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check tuxigap tools tests
      - run: ruff format --check tuxigap tools tests
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_translations.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tuxigap:test .
      - run: docker run --rm -e BOT_TOKEN=0:ci-check tuxigap:test python -m tuxigap --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: tuxigap-browser-preview
          path: browser-artifacts/
